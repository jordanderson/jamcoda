appId: com.jordanderson.jamcoda
productName: JamCoda
copyright: Copyright © JamCoda

directories:
  output: release
  buildResources: build

# Only the builds: esbuild inlines every server dependency into
# dist-electron/server.cjs, and SQLite is Node's own `node:sqlite`, so the app
# needs nothing from node_modules and there is no native module to rebuild.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules{,/**/*}'
npmRebuild: false

publish:
  provider: github
  owner: jordanderson
  repo: jamcoda
  # `draft` is intentionally left unset (defaults to true): each tagged push
  # produces a draft release so the three platform artifacts can be
  # sanity-checked before anyone downloads an unsigned, warning-flagged
  # binary. Flip to `draft: false` later for fully automatic publishing.

mac:
  # No arch here: each run builds the host's unless `--arm64`/`--x64` says
  # otherwise, and the release workflow runs once per arch.
  target:
    - dmg
    - zip
  category: public.app-category.music
  # Ad-hoc signed: there is no Apple Developer certificate. Apple silicon runs
  # no arm64 code without a valid signature, and a downloaded app whose
  # bundle is unsigned reads as "damaged" with no way past it. Ad-hoc signing
  # the whole bundle makes it an unverified app instead, which the user can
  # allow in System Settings. Hardened runtime matters only for notarization,
  # and with an ad-hoc identity it would reject Electron's own frameworks.
  # gatekeeperAssess skips a build-time spctl check that rejects any
  # unnotarized app.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Developer ID signing and notarization replace the three lines above
  # later: an identity from CSC_LINK / CSC_KEY_PASSWORD, `hardenedRuntime:
  # true`, and `notarize` driven by APPLE_ID env vars.

win:
  target:
    - nsis
  # Signing slots in here later, e.g. certificateFile/certificatePassword or
  # signtoolOptions for an EV cert, driven by CSC_LINK / CSC_KEY_PASSWORD env
  # vars at build time.

linux:
  target:
    - AppImage
    - deb
  category: Audio
