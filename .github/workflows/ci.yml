name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned by .nvmrc. better-sqlite3 is native, so the Node major here
          # must match the one the binary is built against.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same three commands AGENTS.md asks for before finishing, in the
      # same order, so local checks and CI cannot drift. `build` re-runs the
      # typecheck; keeping it separate reports a type error as one.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
